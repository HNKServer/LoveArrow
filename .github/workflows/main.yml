name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_PYTHON_VERSION: "3.13"

jobs:
  syntax-check:
    name: Syntax check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile all tracked Python sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          ignored = {".git", ".venv", "venv", "__pycache__"}
          files = sorted(
              path
              for path in Path(".").rglob("*.py")
              if not any(part in ignored for part in path.parts)
          )

          failures: list[tuple[Path, str]] = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append((path, str(exc)))

          print(f"Compiled {len(files)} Python files with Python {sys.version.split()[0]}")
          if failures:
              for path, message in failures:
                  print(f"\n{path}:\n{message}", file=sys.stderr)
              raise SystemExit(1)
          PY

  artifact-docker:
    runs-on: ${{ matrix.runs-on }}
    needs: syntax-check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t npps4 .

      - name: Export Docker image
        run: docker save npps4 | gzip > npps4.tar.gz

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v6
        with:
          name: npps4-docker-${{ runner.arch }}
          path: npps4.tar.gz
          if-no-files-found: error

  pyinstaller-windows:
    runs-on: windows-latest
    needs: syntax-check
    timeout-minutes: 45
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-perf.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-perf.txt "psycopg[binary]" pyinstaller
          python -m pip check

      - name: Make bundle
        run: python -m PyInstaller --noconfirm --clean npps4.spec

      - name: Copy runtime files
        run: |
          robocopy "beatmaps" "dist\npps4\beatmaps" /E
          if errorlevel 8 exit /b 1
          robocopy "external" "dist\npps4\external" /E
          if errorlevel 8 exit /b 1
          robocopy "scripts" "dist\npps4\scripts" /E
          if errorlevel 8 exit /b 1
          robocopy "static" "dist\npps4\static" /E
          if errorlevel 8 exit /b 1
          robocopy "templates" "dist\npps4\templates" /E
          if errorlevel 8 exit /b 1
          copy npps4\server_data.json dist\npps4\server_data.json
          if errorlevel 1 exit /b 1
          copy default_server_key.pem dist\npps4\server_key.pem
          if errorlevel 1 exit /b 1

      - name: Generate config.toml
        env:
          NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER: ${{ secrets.NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER }}
        shell: python
        run: |
          import json
          import os

          def set_toml_value(text: str, section: str, key: str, value: str) -> str:
              lines = text.splitlines(keepends=True)
              current_section = ""
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith("[") and stripped.endswith("]"):
                      current_section = stripped
                      continue
                  if current_section == section and stripped.startswith(f"{key} ="):
                      newline = "\n" if line.endswith("\n") else ""
                      indent = line[: len(line) - len(line.lstrip())]
                      lines[index] = f"{indent}{key} = {json.dumps(value)}{newline}"
                      return "".join(lines)
              raise RuntimeError(f"Missing {key!r} in section {section!r}")

          with open("config.sample.toml", "r", encoding="utf-8", newline="") as f:
              config = f.read()

          replacements = {
              'server_private_key = "default_server_key.pem"': 'server_private_key = "server_key.pem"',
              'server_data = "npps4/server_data.json"': 'server_data = "server_data.json"',
          }
          for source, destination in replacements.items():
              if source not in config:
                  raise RuntimeError(f"Expected config entry not found: {source}")
              config = config.replace(source, destination, 1)

          dlapi_server = os.environ.get("NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER", "").strip()
          if dlapi_server:
              config = set_toml_value(
                  config,
                  "[download.profiles.gl.n4dlapi]",
                  "server",
                  dlapi_server,
              )

          with open("dist/npps4/config.toml", "w", encoding="utf-8", newline="") as f:
              f.write(config)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyinstaller-npps4-windows
          path: dist
          if-no-files-found: error

  pyinstaller-linux:
    runs-on: ${{ matrix.runs-on }}
    needs: syntax-check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-perf.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-perf.txt "psycopg[binary]" pyinstaller
          python -m pip check

      - name: Make bundle
        run: python -m PyInstaller --noconfirm --clean npps4.spec

      - name: Copy runtime files
        run: |
          set -e
          cp -r beatmaps dist/npps4/
          cp -r external dist/npps4/
          cp -r scripts dist/npps4/
          cp -r static dist/npps4/
          cp -r templates dist/npps4/
          cp npps4/server_data.json dist/npps4/server_data.json
          cp default_server_key.pem dist/npps4/server_key.pem

      - name: Generate config.toml
        env:
          NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER: ${{ secrets.NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER }}
        shell: python
        run: |
          import json
          import os

          def set_toml_value(text: str, section: str, key: str, value: str) -> str:
              lines = text.splitlines(keepends=True)
              current_section = ""
              for index, line in enumerate(lines):
                  stripped = line.strip()
                  if stripped.startswith("[") and stripped.endswith("]"):
                      current_section = stripped
                      continue
                  if current_section == section and stripped.startswith(f"{key} ="):
                      newline = "\n" if line.endswith("\n") else ""
                      indent = line[: len(line) - len(line.lstrip())]
                      lines[index] = f"{indent}{key} = {json.dumps(value)}{newline}"
                      return "".join(lines)
              raise RuntimeError(f"Missing {key!r} in section {section!r}")

          with open("config.sample.toml", "r", encoding="utf-8", newline="") as f:
              config = f.read()

          replacements = {
              'server_private_key = "default_server_key.pem"': 'server_private_key = "server_key.pem"',
              'server_data = "npps4/server_data.json"': 'server_data = "server_data.json"',
          }
          for source, destination in replacements.items():
              if source not in config:
                  raise RuntimeError(f"Expected config entry not found: {source}")
              config = config.replace(source, destination, 1)

          dlapi_server = os.environ.get("NPPS4_CONFIG_DOWNLOAD_N4DLAPI_SERVER", "").strip()
          if dlapi_server:
              config = set_toml_value(
                  config,
                  "[download.profiles.gl.n4dlapi]",
                  "server",
                  dlapi_server,
              )

          with open("dist/npps4/config.toml", "w", encoding="utf-8", newline="") as f:
              f.write(config)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyinstaller-npps4-${{ matrix.runs-on }}
          path: dist
          if-no-files-found: error

  upload-release:
    runs-on: ubuntu-latest
    needs: [pyinstaller-windows, pyinstaller-linux, artifact-docker]
    if: github.event_name == 'push' && github.ref_name == 'master'
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6

      - name: List downloaded files
        run: find . -maxdepth 4 -type f -print

      - name: Package artifacts
        run: |
          set -e
          (cd pyinstaller-npps4-windows && zip -r9 ../pyinstaller-npps4-windows.zip .)
          (cd pyinstaller-npps4-ubuntu-22.04 && zip -r9 ../pyinstaller-npps4-ubuntu-22.04.zip .)
          (cd pyinstaller-npps4-ubuntu-22.04-arm && zip -r9 ../pyinstaller-npps4-ubuntu-22.04-arm.zip .)
          mv npps4-docker-X64/npps4.tar.gz npps4-dockerimage-x86-64.tar.gz
          mv npps4-docker-ARM64/npps4.tar.gz npps4-dockerimage-aarch64.tar.gz

      - name: Create or update continuous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(
            pyinstaller-npps4-windows.zip
            pyinstaller-npps4-ubuntu-22.04.zip
            pyinstaller-npps4-ubuntu-22.04-arm.zip
            npps4-dockerimage-x86-64.tar.gz
            npps4-dockerimage-aarch64.tar.gz
          )

          if gh release view continuous --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload continuous "${files[@]}" \
              --clobber \
              --repo "$GH_REPO"
          else
            gh release create continuous "${files[@]}" \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "Continuous Build" \
              --notes "Automated build from the master branch." \
              --prerelease
          fi
